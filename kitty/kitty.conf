# ================================
# Kitty config – Arch Linux / Hyprland
# ================================

allow_remote_control yes
editor /usr/local/bin/nvim

# Font
font_family Victor Mono
font_size 14.0
adjust_line_height 135%

# Cursor
cursor_shape block

# Crazy Fun Cursor Trail
cursor_trail 2
cursor_trail_start_threshold 40

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0.0

tab_title_template "󰺕 {sup.index} {title}"
active_tab_title_template "{fmt.fg.orange}  {fmt.fg.tab}{title}"

# Window behavior
hide_window_decorations yes
remember_window_size yes
resize_in_steps no

# Clipboard & text
strip_trailing_spaces smart
copy_on_select true
underline_hyperlinks always
undercurl_style thin-dense

# Mouse
mouse_hide_wait -1

# URLs
open_url_with default

# Font decorations
modify_font underline_position 9
modify_font underline_thickness 150%
modify_font strikethrough_position 2px

# ================================
# Keybindings (Linux / Ctrl-based)
# ================================

# Tab navigation
map ctrl+alt+right next_tab
map ctrl+alt+left previous_tab

# Jump to tab by number
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
